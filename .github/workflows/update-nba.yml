name: Actualizar estadísticas NBA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nba.yml'
      - 'scripts/update.py'
      - 'scripts/model_v2.py'
      - 'scripts/context_sources.py'
      - 'scripts/validation.py'
  workflow_dispatch:
  schedule:
    # Hora República Dominicana: mañana, tarde y antes del último bloque de partidos
    - cron: '15 9 * * *'
      timezone: 'America/Santo_Domingo'
    - cron: '30 17 * * *'
      timezone: 'America/Santo_Domingo'
    - cron: '0 20 * * *'
      timezone: 'America/Santo_Domingo'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el modelo sin depender de fuentes externas
        run: python -m unittest discover -s tests -v
      - name: Actualizar datos deportivos y contexto público
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: python scripts/update.py
      - name: Guardar datos e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos NBA"
            git push
          fi
