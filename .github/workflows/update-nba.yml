name: Actualizar estadísticas NBA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nba.yml'
      - 'scripts/update.py'
      - 'scripts/model_v2.py'
      - 'scripts/context_sources.py'
      - 'scripts/validation.py'
      - 'scripts/scouting.py'
  workflow_dispatch:
  schedule:
    # Hora República Dominicana: mañana, tarde y antes del último bloque de partidos
    - cron: '15 9 * * *'
      timezone: 'America/Santo_Domingo'
    - cron: '30 17 * * *'
      timezone: 'America/Santo_Domingo'
    - cron: '17 20 * * *'
      timezone: 'America/Santo_Domingo'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-analytics-data
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar el modelo sin depender de fuentes externas
        run: python -m unittest discover -s tests -v
      - name: Actualizar datos deportivos y contexto público
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: python scripts/update.py
      - name: Guardar datos e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/events-cache.json data/player-box-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos NBA"
            # Admitir ediciones hechas en GitHub mientras el cálculo se ejecuta
            for intento in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$intento" = "4" ]; then
                echo "::error::No se pudo sincronizar la actualización sin perder cambios."
                exit 1
              fi
              sleep 4
            done
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar los datos actualizados
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar la página con las estadísticas nuevas
        id: deployment
        uses: actions/deploy-pages@v4
