name: Verificar calidad NBA Analytics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - 'data/**'
      - '.github/workflows/verificar-calidad.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'index.html'
      - 'data/**'
      - '.github/workflows/verificar-calidad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Comprobar modelo y fuentes sin datos externos
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxis de módulos
        run: python -m compileall -q scripts tests
      - name: Ejecutar pruebas aisladas
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript sin ejecutar la aplicación
        run: node --check assets/app.js
      - name: Verificar que la interfaz funcione con datos de ejemplo
        run: node tests/ui-smoke.cjs
      - name: Comprobar archivos necesarios para la web
        run: |
          test -f index.html
          test -f assets/app.js
          test -f assets/style.css
          test -f data/latest.json
          python -m json.tool data/latest.json > /dev/null
